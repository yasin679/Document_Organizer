name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        run: dotnet publish src/DocumentOrganizer/DocumentOrganizer.csproj -c Release -o app

      - name: Start storage emulators (Azurite for Azure Blob, moto for S3)
        run: |
          npm install -g azurite
          pip install "moto[server]"
          azurite-blob --silent --location "$RUNNER_TEMP/azurite" --blobPort 10000 --skipApiVersionCheck &
          moto_server -H 127.0.0.1 -p 9000 &
          sleep 5

      - name: Start the app
        run: |
          cd app
          DOCORG_ADMIN_PASSWORD='Ci-Test-Pass-2026!' dotnet DocumentOrganizer.dll > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5080/healthz && break; sleep 1; done

      - name: End-to-end tests (local folder, Azure Blob, S3, cross-provider)
        run: node tests/e2e.mjs http://localhost:5080 'Ci-Test-Pass-2026!' all

      - name: App log
        if: always()
        run: cat "$RUNNER_TEMP/app.log" || true
